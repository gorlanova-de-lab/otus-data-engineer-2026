input {
  file {
    path => "/app/weblog.csv"
    mode => "read"
    exit_after_read => true
    file_completed_action => "log"
    file_completed_log_path => "/tmp/completed-files.log"
    sincedb_path => "/usr/share/logstash/data/sincedb-v2"
    start_position => "beginning"
  }
}
filter {
  csv { columns => ["client_ip", "timestamp", "request", "status_code"] separator => "," }
  if [client_ip] == "IP" { drop {} }
  else {
    mutate { copy => { "timestamp" => "parsed_timestamp" } }
    mutate { gsub => ["parsed_timestamp", "^\[", "", "parsed_timestamp", "\]$", ""] }
    date {
      match => ["parsed_timestamp", "dd/MMM/yyyy:HH:mm:ss"]
      locale => "en"
      timezone => "UTC"
      target => "@timestamp"
    }
    grok { match => { "request" => "^%{WORD:method} %{NOTSPACE:url} HTTP/%{NUMBER:http_version}$" } }
    if [status_code] !~ /^[1-5][0-9]{2}$/ { mutate { add_tag => ["_invalidstatus"] } }
    else { mutate { convert => { "status_code" => "integer" } } }
  }
}
output {
  if "_dateparsefailure" in [tags] or "_csvparsefailure" in [tags] or "_grokparsefailure" in [tags] or "_invalidstatus" in [tags] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "weblogs-rejected-v2" }
  } else {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "weblogs-v2-%{+yyyy.MM.dd}" }
  }
}

