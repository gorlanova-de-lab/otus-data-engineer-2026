name: otus16-elk
services:
  elasticsearch:
    image: elasticsearch:7.14.1
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  kibana:
    image: kibana:7.14.1
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    depends_on:
      elasticsearch:
        condition: service_healthy
  logstash:
    image: logstash:7.14.1
    profiles: ["load"]
    command: ["logstash", "-f", "/usr/share/logstash/pipeline/clickstream.conf"]
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      PIPELINE_WORKERS: "1"
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./clickstream.conf:/usr/share/logstash/pipeline/clickstream.conf:ro
      - ./weblog.csv:/app/weblog.csv:ro
      - sincedb:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy
volumes:
  esdata:
  sincedb:



