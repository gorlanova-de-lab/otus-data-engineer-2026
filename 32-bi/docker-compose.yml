name: otus-weather
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - weatherdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 5s
      timeout: 5s
      retries: 20
  pipeline:
    build: .
    environment:
      PGHOST: postgres
      PGDATABASE: weather
      PGUSER: weather
      PGPASSWORD: ${POSTGRES_PASSWORD}
      INTERVAL_SECONDS: "86400"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  metabase:
    image: metabase/metabase:v0.56.5
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  weatherdata:
  metabase:
